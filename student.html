<!DOCTYPE html>
<html>
<head>
    <title>Student View</title>
</head>
<body style="font-family:Arial; background:#f4f6f8; padding:40px">

<h2>Student Result</h2>

<form method="POST">
    <input type="text" name="student_name" placeholder="Enter Student Name / ID" required>
    <button type="submit">View Result</button>
</form>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

{% if student %}
<hr>
<p><b>Student:</b> {{ student.Student }}</p>
<p><b>Average:</b> {{ student.Average }}</p>
<p><b>Risk:</b> {{ student.Risk }}</p>
<p><b>Learning Gaps:</b> {{ student.Gaps }}</p>

<ul>
{% for tip in student.Suggestions %}
    <li>{{ tip }}</li>
{% endfor %}
</ul>
{% endif %}

</body>
</html>
